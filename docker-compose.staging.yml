services:
  api:
    environment:
      CRYPTO_DB_BACKEND: ${CRYPTO_DB_BACKEND:-postgres}
      CRYPTO_DATABASE_URL: ${CRYPTO_DATABASE_URL:-postgresql://crypto:crypto@postgres:5432/crypto}
      CRYPTO_EXECUTION_BACKEND: ${CRYPTO_EXECUTION_BACKEND:-paper}
      CRYPTO_BINANCE_API_KEY: ${CRYPTO_BINANCE_API_KEY:-}
      CRYPTO_BINANCE_API_SECRET: ${CRYPTO_BINANCE_API_SECRET:-}
    volumes:
      - ${CRYPTO_STAGING_STORAGE_DIR:-./staging/storage}:/app/storage
      - ${CRYPTO_STAGING_LOG_DIR:-./staging/logs}:/app/logs
      - ${CRYPTO_STAGING_RUNTIME_DIR:-./staging/runtime}:/app/runtime

