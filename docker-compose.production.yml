# Production overrides.
# Credentials are read from the .env file (never commit secrets to git).
# Required .env keys: CRYPTO_DATABASE_URL, CRYPTO_BINANCE_API_KEY,
#                     CRYPTO_BINANCE_API_SECRET, TELEGRAM_BOT_TOKEN,
#                     TELEGRAM_CHAT_ID, CRYPTO_POSTGRES_PASSWORD

services:
  api:
    build:
      args:
        REQUIREMENTS_FILE: requirements.txt
    environment:
      CRYPTO_DB_BACKEND: postgres
      CRYPTO_DATABASE_URL: ${CRYPTO_DATABASE_URL}

  scheduler:
    build:
      args:
        REQUIREMENTS_FILE: requirements.txt
    environment:
      CRYPTO_DB_BACKEND: postgres
      CRYPTO_DATABASE_URL: ${CRYPTO_DATABASE_URL}

  futures-candles:
    environment:
      CRYPTO_DB_BACKEND: postgres
      CRYPTO_DATABASE_URL: ${CRYPTO_DATABASE_URL}

  futures-orderbook:
    environment:
      CRYPTO_DB_BACKEND: postgres
      CRYPTO_DATABASE_URL: ${CRYPTO_DATABASE_URL}

  futures-aggtrade:
    environment:
      CRYPTO_DB_BACKEND: postgres
      CRYPTO_DATABASE_URL: ${CRYPTO_DATABASE_URL}

  futures-premium:
    environment:
      CRYPTO_DB_BACKEND: postgres
      CRYPTO_DATABASE_URL: ${CRYPTO_DATABASE_URL}

  futures-open-interest:
    environment:
      CRYPTO_DB_BACKEND: postgres
      CRYPTO_DATABASE_URL: ${CRYPTO_DATABASE_URL}

  futures-liquidation:
    environment:
      CRYPTO_DB_BACKEND: postgres
      CRYPTO_DATABASE_URL: ${CRYPTO_DATABASE_URL}
